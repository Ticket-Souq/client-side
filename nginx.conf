# Grafana live-streaming panels upgrade HTTP to WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS, used for deferred upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api-gateway:8080;
    set $grafana_upstream http://grafana:3000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: same-origin proxy to the api-gateway on the Docker network
    location /api/ {
        proxy_pass $api_upstream;
        # The api-gateway CORS allowlist only accepts http://localhost:5173; all
        # traffic here is same-origin through this proxy, so drop the Origin
        # header and let the gateway skip CORS validation.
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Uploaded media (posters/banners): served by the api-gateway via event-service
    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Grafana: same-origin proxy so monitoring works locally and via the tunnel.
    # The /grafana/ prefix is preserved; Grafana is configured with
    # serve_from_sub_path so it serves its UI and API from this sub-path.
    #
    # Grafana bakes the %(protocol)s/%(domain)s root_url macros once at startup
    # (http://localhost/grafana/), ignoring forwarded headers, so rewrite that
    # to a protocol-relative URL based on the request host. This keeps the
    # embedded appUrl correct for any host (localhost, tunnel, ...) and scheme.
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        # Disable upstream compression so sub_filter can rewrite response bodies
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter 'http://localhost/grafana' '//$host/grafana';
        sub_filter_once off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Bare /grafana (e.g. "Open Grafana" button) redirects into the proxy
    location = /grafana {
        return 301 /grafana/;
    }

    # Cache hashed static assets aggressively, HTML never
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
