server {
    listen 80;
    server_name _;

    # Docker embedded DNS, used for deferred upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api-gateway:8080;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: same-origin proxy to the api-gateway on the Docker network
    location /api/ {
        proxy_pass $api_upstream;
        # The api-gateway CORS allowlist only accepts http://localhost:5173; all
        # traffic here is same-origin through this proxy, so drop the Origin
        # header and let the gateway skip CORS validation.
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Uploaded media (posters/banners): served by the api-gateway via event-service
    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache hashed static assets aggressively, HTML never
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
